version: '3.8'

services:
  builder:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/src
      - shared:/shared
    command: >
      sh -c "cd /src &&
             mvn clean package -DskipTests &&
             cp /src/target/*.war /shared/app.war"
    restart: "no"

  tomcat:
    image: tomcat:9-jdk17-temurin
    volumes:
      - shared:/usr/local/tomcat/webapps
    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  shared: